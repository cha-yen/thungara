name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Automated Test Suite (Node.js & Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-Dependency Linter & Syntax Guard
        run: npm run lint

      - name: Run Data & Vector Math Integrity Audit
        run: npm run audit:data

      - name: Run PWA & Offline Resilience Test Suite
        run: npm run test:pwa

      - name: Run WCAG 2.1 AA Accessibility Guard
        run: npm run audit:a11y

      - name: Run Node.js Unified Test Suite
        run: npm test

      - name: Run Search Latency & Memory Benchmark SLA
        run: npm run bench

      - name: Run Python Full-System Audit
        run: python tests/test_full_system.py

      - name: Run Python Search Benchmarks
        run: python tests/test_search.py
