name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Automated Test Suite (Node.js & Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Node.js Unified Test Suite
        run: npm test

      - name: Run Python Full-System Audit
        run: python tests/test_full_system.py

      - name: Run Python Search Benchmarks
        run: python tests/test_search.py
