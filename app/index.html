  }
}

function copyCurrentLyrics() {
  if (currentModalSongIdx !== null) {
    copyLyrics(currentModalSongIdx);
  }
}

function shareCurrentSong() {
  if (currentModalSongIdx !== null) {
    shareSong(currentModalSongIdx);
  }
}

async function shareSong(idx) {
  if (!DATA || !DATA.songs || !DATA.songs[idx]) return;
  const song = DATA.songs[idx];
  const ytId = song.yt || YOUTUBE_MAP[song.id] || YOUTUBE_MAP[String(song.id)] || YOUTUBE_MAP[String(idx)];
  const ytUrl = ytId ? 'https://youtu.be/' + ytId : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(song.title + ' ' + song.artist);
  
  const snippet = song.lyrics.split('\n').filter(l => l.trim()).slice(0, 3).join('\n');
  const appUrl = (window.location.origin && window.location.origin !== 'null' && window.location.pathname) ? (window.location.origin + window.location.pathname + '?song=' + idx) : '';
  const shareText = '🎵 เพลง: ' + song.title + '\n🎤 ศิลปิน: ' + song.artist + '\n\n"' + snippet + '..."\n\n' + (appUrl ? 'อ่านเนื้อเพลง: ' + appUrl + '\n' : '') + 'ฟังเพลง: ' + ytUrl;

  if (navigator.share && (!navigator.canShare || navigator.canShare({ title: song.title }))) {
    try {
      await navigator.share({
        title: song.title + ' - ' + song.artist,
        text: shareText,
        url: ytUrl,
      });
      return;
    } catch (err) {
      if (err.name !== 'AbortError') {
        copyToClipboard(shareText, 'คัดลอกข้อมูลเพลงเรียบร้อยแล้ว!');
      }
    }
  } else {
    copyToClipboard(shareText, 'คัดลอกข้อมูลเพลงและลิงก์ YouTube แล้ว!');
  }
}

function copyLyrics(idx) {
  if (!DATA || !DATA.songs || !DATA.songs[idx]) return;
  const song = DATA.songs[idx];
  const fullText = 'เพลง: ' + song.title + '\nศิลปิน: ' + song.artist + '\n\n' + song.lyrics;
  copyToClipboard(fullText, 'คัดลอกเนื้อเพลงทั้งหมดเรียบร้อย!');
}

function copyToClipboard(text, successMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(successMsg);
    }).catch(() => {
      fallbackCopy(text, successMsg);
    });
  } else {
    fallbackCopy(text, successMsg);
  }
}

function fallbackCopy(text, successMsg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '-9999px';
  ta.style.fontSize = '12pt';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast(successMsg);
  } catch (e) {
    showToast('ไม่สามารถคัดลอกได้');
  }
  document.body.removeChild(ta);
}

let toastTimer = null;
function showToast(msg) {
  let toast = document.getElementById('toast-msg');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast-msg';
    toast.className = 'toast-msg';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
  }
  toast.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ' + esc(msg);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

function closeModalDirect() {
  const overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.classList.remove('show');
  document.body.style.overflow = '';
  const videoWrap = document.getElementById('modal-video-wrap');
  if (videoWrap) videoWrap.innerHTML = '';
  currentModalSongIdx = null;
  if (previousActiveElement && typeof previousActiveElement.focus === 'function') {
    try { previousActiveElement.focus(); } catch (e) {}
    previousActiveElement = null;
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay') || e.target.closest('.modal-handle') || e.target.closest('.btn-modal-close')) {
    closeModalDirect();
  }
}

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('mic-btn').classList.add('unavailable');
    return;
  }

  recognition = new SR();
  recognition.lang = 'th-TH';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalTranscript = '';
  const micBtn = document.getElementById('mic-btn');
  const recOverlay = document.getElementById('rec-overlay');
  const recStatus = document.getElementById('rec-status');
  const recTranscript = document.getElementById('rec-transcript');

  recognition.onstart = function() {
    isRecording = true;
    finalTranscript = '';
    micBtn.classList.add('recording');
    recOverlay.classList.add('show');
    recStatus.textContent = 'กำลังฟัง...';
    recTranscript.innerHTML = '<span class="interim">ร้องหรือพูดเนื้อเพลงได้เลย</span>';
    document.getElementById('rec-hint').textContent = 'แตะเพื่อหยุด';
  };

  recognition.onresult = function(event) {
    let interim = '';
    finalTranscript = '';
    for (let i = 0; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    let html = '';
    if (finalTranscript) html += esc(finalTranscript);
    if (interim) html += '<span class="interim">' + esc(interim) + '</span>';
    recTranscript.innerHTML = html || '<span class="interim">ร้องหรือพูดเนื้อเพลงได้เลย</span>';
    if (finalTranscript || interim) recStatus.textContent = 'กำลังจับเสียง...';
  };

  recognition.onend = function() {
    isRecording = false;
    micBtn.classList.remove('recording');
    if (finalTranscript.trim()) {
      recStatus.textContent = 'กำลังค้นหา...';
      setTimeout(() => {
        recOverlay.classList.remove('show');
        document.getElementById('search-input').value = finalTranscript.trim();
        var el = document.getElementById('search-input');
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        currentQuery = finalTranscript.trim();
        doSearch();
      }, 500);
    } else {
      recStatus.textContent = 'ไม่ได้ยินเสียง';
      recTranscript.textContent = 'กลับสู่หน้าหลัก...';
      document.getElementById('rec-hint').textContent = 'กำลังปิด';
      manualStopRequested = false;
      setTimeout(() => { recOverlay.classList.remove('show'); }, 800);
    }
  };

  recognition.onerror = function(event) {
    isRecording = false;
    micBtn.classList.remove('recording');
    const msg = event.error === 'no-speech' ? 'ไม่ได้ยินเสียง ลองใหม่อีกครั้ง'
      : event.error === 'not-allowed' ? 'กรุณาอนุญาตการใช้ไมโครโฟน'
      : 'เกิดข้อผิดพลาด: ' + event.error;
    recStatus.textContent = msg;
    recTranscript.textContent = '';
    if (event.error === 'no-speech') {
      recTranscript.textContent = 'กลับสู่หน้าหลัก...';
      document.getElementById('rec-hint').textContent = 'กำลังปิด';
      setTimeout(() => { recOverlay.classList.remove('show'); }, 800);
    } else {
      setTimeout(() => { recOverlay.classList.remove('show'); }, 2500);
    }
  };
}

function handleRecordingOverlayClick() {
  if (isRecording) {
    toggleRecording();
  } else {
    document.getElementById('rec-overlay').classList.remove('show');
  }
}

function toggleRecording() {
  if (!recognition) return;
  if (isRecording) {
    manualStopRequested = true;
    recognition.stop();
  } else {
    manualStopRequested = false;
    try { recognition.start(); }
    catch(e) { recognition.stop(); setTimeout(() => recognition.start(), 200); }
  }
}

function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  currentQuery = query;
  document.getElementById('btn-clear').classList.toggle('show', query.length > 0);
  if (!DATA) return;
  if (!query && !document.getElementById('filter-artist').value
      && !document.getElementById('filter-emotion').value
      && !document.getElementById('filter-year').value) {
    document.getElementById('search-progress').classList.remove('active');
    renderResults([], '');
    return;
  }
  const fa = document.getElementById('filter-artist').value;
  const fe = document.getElementById('filter-emotion').value;
  const fy = document.getElementById('filter-year').value;

  if (searchWorker) {
    document.getElementById('search-progress').classList.add('active');
    try {
      searchWorker.postMessage({ type: 'search', payload: { query: query || '  ', filterArtist: fa, filterEmotion: fe, filterYear: fy } });
    } catch (e) {
      console.warn('Worker postMessage failed, falling back to main thread:', e);
      searchWorker = null;
      const results = search(query || '  ');
      document.getElementById('search-progress').classList.remove('active');
      renderResults(results, query);
      if (query && query.trim().length >= 2 && results && results.length > 0) {
        saveRecentSearch(query.trim());
      }
    }
  } else {
    const results = search(query || '  ');
    document.getElementById('search-progress').classList.remove('active');
    renderResults(results, query);
    if (query && query.trim().length >= 2 && results && results.length > 0) {
      saveRecentSearch(query.trim());
    }
  }
}

function clearSearch() {
  var el = document.getElementById('search-input');
  el.value = '';
  el.style.height = 'auto';
  currentQuery = '';
  rawSearchResults = [];
  document.getElementById('btn-clear').classList.remove('show');
  document.getElementById('filter-artist').value = '';
  document.getElementById('filter-emotion').value = '';
  document.getElementById('filter-year').value = '';
  renderResults([], '');
  el.focus();
}

const SafeStorage = {
  get(key, fallback = null) {
    try {
      if (typeof window === 'undefined' || !window.localStorage) return fallback;
      const val = window.localStorage.getItem(key);
      return val !== null ? val : fallback;
    } catch (e) {
      return fallback;
    }
  },
  getJSON(key, fallback = null) {
    try {
      const raw = this.get(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      if (typeof window === 'undefined' || !window.localStorage) return false;
      window.localStorage.setItem(key, String(value));
      return true;
    } catch (e) {
      return false;
    }
  },
  setJSON(key, value) {
    try {
      return this.set(key, JSON.stringify(value));
    } catch (e) {
      return false;
    }
  },
  remove(key) {
    try {
      if (typeof window === 'undefined' || !window.localStorage) return false;
      window.localStorage.removeItem(key);
      return true;
    } catch (e) {
      return false;
    }
  }
};

const RECENT_KEY = 'thungara_recent_searches';
function getRecentSearches() {
  return SafeStorage.getJSON(RECENT_KEY, []);
}

function saveRecentSearch(q) {
  if (!q || q.length < 2) return;
  let list = getRecentSearches();
  list = list.filter(item => item.toLowerCase() !== q.toLowerCase());
  list.unshift(q);
  if (list.length > 5) list = list.slice(0, 5);
  SafeStorage.setJSON(RECENT_KEY, list);
  renderRecentSearches();
}

function removeRecentSearch(q, e) {
  if (e) e.stopPropagation();
  let list = getRecentSearches();
  list = list.filter(item => item !== q);
  SafeStorage.setJSON(RECENT_KEY, list);
  renderRecentSearches();
}

function clearRecentSearches() {
  SafeStorage.remove(RECENT_KEY);
  renderRecentSearches();
}

function applyRecentSearch(q) {
  const input = document.getElementById('search-input');
  if (input) {
    input.value = q;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    doSearch();
  }
}

function renderRecentSearches() {
  const wrap = document.getElementById('recent-searches-wrap');
  const chipsList = document.getElementById('recent-chips');
  if (!wrap || !chipsList) return;

  const searches = getRecentSearches();
  if (searches.length === 0) {
    wrap.style.display = 'none';
    chipsList.innerHTML = '';
    return;
  }

  wrap.style.display = 'block';
  let html = '';
  searches.forEach(term => {
    const escaped = esc(term);
    const escapedParam = escaped.replace(/'/g, "\\'");
    html += `<div class="chip" role="button" tabindex="0" onclick="applyRecentSearch('${escapedParam}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();applyRecentSearch('${escapedParam}');}" title="ค้นหา '${escaped}' อีกครั้ง" aria-label="ค้นหา '${escaped}' อีกครั้ง">` +
      `<span>${escaped}</span>` +
      `<button class="chip-btn-del" onclick="removeRecentSearch('${escapedParam}', event)" title="ลบ" aria-label="ลบคำค้นหา ${escaped}">&times;</button>` +
      `</div>`;
  });
  chipsList.innerHTML = html;
}

function getTheme() {
  return SafeStorage.get('theme', 'auto');
}
function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === 'dark') {
    root.setAttribute('data-theme', 'dark');
  } else if (theme === 'light') {
    root.setAttribute('data-theme', 'light');
  } else {
    root.removeAttribute('data-theme');
  }
  updateThemeIcon();
}
function toggleTheme() {
  const isDark = isDarkActive();
  const next = isDark ? 'light' : 'dark';
  SafeStorage.set('theme', next);
  applyTheme(next);
}
function isDarkActive() {
  const theme = getTheme();
  if (theme === 'dark') return true;
  if (theme === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function updateThemeIcon() {
  const btn = document.getElementById('btn-theme');
  if (btn) btn.textContent = isDarkActive() ? '☀️' : '🌙';
}
applyTheme(getTheme());

function esc(s) {
  if (s === null || s === undefined) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function escRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

document.getElementById('search-input').addEventListener('input', function() {
  autoResize(this);
  clearTimeout(debounceTimer);
  if (this.value.trim()) {
    document.getElementById('search-progress').classList.add('active');
  } else {
    document.getElementById('filter-artist').value = '';
    document.getElementById('filter-emotion').value = '';
    document.getElementById('filter-year').value = '';
  }
  debounceTimer = setTimeout(doSearch, 300);
  document.getElementById('btn-clear').classList.toggle('show', this.value.length > 0);
});

document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); clearTimeout(debounceTimer); doSearch(); }
});

document.addEventListener('keydown', function(e) {
  const modalOverlay = document.getElementById('modal-overlay');
  const isModalOpen = modalOverlay && modalOverlay.classList.contains('show');

  if (isModalOpen && e.key === 'Tab') {
    const focusables = modalOverlay.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (focusables.length > 0) {
      const firstEl = focusables[0];
      const lastEl = focusables[focusables.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === firstEl || !modalOverlay.contains(document.activeElement)) {
          e.preventDefault();
          lastEl.focus();
        }
      } else {
        if (document.activeElement === lastEl || !modalOverlay.contains(document.activeElement)) {
          e.preventDefault();
          firstEl.focus();
        }
      }
    }
    return;
  }

  if (e.key === 'Escape') {
    if (isModalOpen) {
      closeModalDirect();
      e.preventDefault();
      return;
    }
    const input = document.getElementById('search-input');
    if (input && (document.activeElement === input || input.value)) {
      clearSearch();
      input.blur();
      e.preventDefault();
    }
    return;
  }

  if (e.key === '/' && !isModalOpen) {
    const activeEl = document.activeElement;
    const isEditing = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);
    if (!isEditing) {
      e.preventDefault();
      const input = document.getElementById('search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  }
});

window.addEventListener('scroll', function() {
  document.getElementById('btn-top').classList.toggle('show', window.scrollY > 400);
}, { passive: true });

if ('caches' in window) {
  caches.keys().then(keys => {
    keys.forEach(k => {
      if (k !== 'thungara-v15') caches.delete(k);
    });
  });
}

if ('serviceWorker' in navigator) {
  const serviceWorkerPath = window.location.pathname === '/' ? '/sw.js' : 'sw.js';
  navigator.serviceWorker.register(serviceWorkerPath).then(reg => {
    reg.update();
  }).catch(() => {});
}

initSpeechRecognition();
loadData();
